name: Build Android 9 Vulkan WSI Probe

on:
  workflow_dispatch:
  push:
    branches:
      - vulkan-test
    paths:
      - 'android/vulkan-probe/**'
      - 'android/settings.gradle'
      - '.github/workflows/build-vulkan-probe.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Vulkan test APK
        run: |
          gradle --no-daemon -p android :vulkan-probe:assembleDebug
          test -f android/vulkan-probe/build/outputs/apk/debug/vulkan-probe-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android9-Vulkan-WSI-Probe
          path: android/vulkan-probe/build/outputs/apk/debug/vulkan-probe-debug.apk
          if-no-files-found: error
          retention-days: 7
